<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segnala Problema</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'CiscoSansTT', 'Helvetica Neue', Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 90%;
      max-width: 680px;
      overflow: hidden;
      position: relative;
      display: flex;
    }
    .left {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      border-right: 1px solid #ebebeb;
      background: white;
    }
    .left img { max-width: 140px; max-height: 100px; object-fit: contain; mix-blend-mode: multiply; }
    .right {
      flex: 1;
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .step { display: none; }
    .step.active { display: flex; flex-direction: column; }

    /* --- Stato invio in corso --- */
    .spinner-wrap { align-items: center; gap: 20px; }
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid #e0e0e0;
      border-top-color: #049FD9;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sending-title { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .sending-sub { font-size: 14px; color: #888; margin-top: 6px; }

    /* --- Riepilogo --- */
    .recap-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 20px; }
    .recap-row {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px;
    }
    .recap-label { color: #888; width: 110px; flex-shrink: 0; font-size: 13px; }
    .recap-value { color: #1a1a1a; font-weight: 600; }
    .btn-submit {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: #049FD9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-submit:hover { background: #0381b0; }

    /* --- Successo --- */
    .success-wrap { align-items: center; text-align: center; }
    .success-icon { font-size: 56px; margin-bottom: 16px; }
    .success-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .success-sub { color: #666; font-size: 15px; margin-bottom: 20px; }
    .countdown-text { font-size: 13px; color: #aaa; }
    .countdown-bar-wrap { width: 100%; height: 4px; background: #eee; border-radius: 2px; margin-top: 16px; }
    .countdown-bar { height: 4px; background: #049FD9; border-radius: 2px; width: 100%; transition: width 1s linear; }

    /* --- Errore --- */
    .error-box {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      margin-top: 16px;
    }
    .btn-retry {
      margin-top: 12px;
      padding: 10px 24px;
      background: #049FD9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="left">
    <img src="logo azienda.jpg" alt="Logo">
  </div>
  <div class="right">

    <!-- Step: invio in corso -->
    <div id="step-sending" class="step spinner-wrap">
      <div class="spinner"></div>
      <div>
        <div class="sending-title">Invio in corso…</div>
        <div class="sending-sub">Stiamo inviando la tua segnalazione</div>
      </div>
    </div>

    <!-- Step: successo -->
    <div id="step-success" class="step success-wrap">
      <div class="success-icon">✅</div>
      <div class="success-title">Segnalazione inviata!</div>
      <div class="success-sub">Grazie <strong id="thank-name"></strong>, provvederemo al più presto.</div>
      <div class="countdown-text">La finestra si chiude tra <strong id="countdown">5</strong> secondi…</div>
      <div class="countdown-bar-wrap"><div class="countdown-bar" id="countdown-bar"></div></div>
    </div>

    <!-- Step: errore -->
    <div id="step-error" class="step">
      <div class="error-box">
        ⚠️ Errore durante l'invio. Controlla la connessione e riprova.<br>
        <small id="error-detail"></small>
      </div>
      <button class="btn-retry" onclick="sendWebhook()">Riprova</button>
    </div>

  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const DATA = {
    name:       params.get('name')     || 'Anonimo',
    room:       params.get('room')     || 'Sala sconosciuta',
    category:   params.get('category') || 'Non specificata',
    details:    params.get('details')  || '',
    webhook:    params.get('webhook')  || '',
    autosubmit: params.get('autosubmit') === '1',
  };

  document.getElementById('thank-name').textContent = DATA.name;

  function show(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function sendWebhook() {
    show('step-sending');
    const now = new Date().toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
    const markdown =
      `## 🚨 Nuova Segnalazione Problemi\n\n---\n` +
      `| Campo | Valore |\n|-------|--------|\n` +
      `| 👤 **Segnalato da** | ${DATA.name} |\n` +
      `| 🏠 **Sala** | ${DATA.room} |\n` +
      `| ⚠️ **Categoria** | ${DATA.category} |\n` +
      `| 💬 **Dettagli** | ${DATA.details || '_Nessun dettaglio_'} |\n` +
      `| 🕐 **Data/Ora** | ${now} |`;

    try {
      const res = await fetch(DATA.webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ markdown }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      startCountdown();
    } catch(e) {
      document.getElementById('error-detail').textContent = e.message;
      show('step-error');
    }
  }

  function startCountdown() {
    show('step-success');
    let sec = 5;
    const cd = document.getElementById('countdown');
    const bar = document.getElementById('countdown-bar');
    // Avvia animazione barra
    requestAnimationFrame(() => {
      bar.style.transition = `width ${sec}s linear`;
      bar.style.width = '0%';
    });
    const iv = setInterval(() => {
      sec--;
      cd.textContent = sec;
      if (sec <= 0) { clearInterval(iv); }
    }, 1000);
  }

  // Auto-submit appena la pagina è caricata
  if (DATA.autosubmit && DATA.webhook) {
    sendWebhook();
  } else {
    show('step-error');
    document.getElementById('error-detail').textContent = 'Parametri mancanti.';
  }
</script>
</body>
</html>
