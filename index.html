<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segnala Problema</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Pulsante CHIUDI fisso */
    #btn-close {
      position: fixed;
      top: 20px; right: 20px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #E8001B;
      border: 3px solid white;
      font-size: 26px; font-weight: 700; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(232,0,27,0.55);
    }
    #btn-close:active { transform: scale(0.9); }

    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      width: 100%; max-width: 640px;
      padding: 48px 44px 44px;
      text-align: center;
    }

    .icon { font-size: 72px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
    .sub { font-size: 16px; color: #666; margin-bottom: 32px; line-height: 1.5; }

    .detail-row {
      background: #f7f9fc;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .detail-label { font-size: 12px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .05em; min-width: 80px; }
    .detail-value { font-size: 15px; color: #222; font-weight: 600; }

    .bar-wrap { width: 100%; height: 5px; background: #eee; border-radius: 4px; margin-top: 28px; }
    .bar { height: 5px; background: #049FD9; border-radius: 4px; width: 100%; transition: width 1s linear; }
    .countdown-text { font-size: 13px; color: #aaa; margin-top: 10px; }

    /* Schermata errore */
    .err-icon { font-size: 64px; margin-bottom: 16px; }
    .err-title { font-size: 22px; font-weight: 700; color: #E8001B; margin-bottom: 8px; }
    .err-sub { font-size: 15px; color: #666; }
  </style>
</head>
<body>

  <button id="btn-close" onclick="closePage()" title="Chiudi">&#x2715;</button>

  <div class="card" id="card-success">
    <div class="icon">&#x2705;</div>
    <h1>Segnalazione inviata!</h1>
    <div class="sub">Grazie <strong id="thank-name"></strong>, il tuo problema e stato registrato.<br>Provvederemo al piu presto.</div>

    <div class="detail-row">
      <span class="detail-label">Sala</span>
      <span class="detail-value" id="d-room"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Categoria</span>
      <span class="detail-value" id="d-cat"></span>
    </div>
    <div class="detail-row" id="row-details" style="display:none">
      <span class="detail-label">Dettagli</span>
      <span class="detail-value" id="d-details"></span>
    </div>

    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="countdown-text">Chiusura automatica tra <strong id="cd">7</strong> secondi</div>
  </div>

  <div class="card" id="card-error" style="display:none">
    <div class="err-icon">&#x274C;</div>
    <div class="err-title">Qualcosa e andato storto</div>
    <div class="err-sub">Non e stato possibile inviare la segnalazione.<br>Riprova o contatta l'IT direttamente.</div>
  </div>

<script>
  var p    = new URLSearchParams(location.search);
  var name = p.get('name')     || '';
  var room = p.get('room')     || 'N/D';
  var cat  = p.get('category') || 'N/D';
  var det  = p.get('details')  || '';
  var ok   = p.get('status')   === 'ok';

  if (!ok) {
    document.getElementById('card-success').style.display = 'none';
    document.getElementById('card-error').style.display   = 'block';
  } else {
    document.getElementById('thank-name').textContent = name || 'utente';
    document.getElementById('d-room').textContent     = room;
    document.getElementById('d-cat').textContent      = cat;
    if (det) {
      document.getElementById('d-details').textContent        = det;
      document.getElementById('row-details').style.display    = 'flex';
    }
    startCountdown();
  }

  function startCountdown() {
    var sec = 7;
    var cd  = document.getElementById('cd');
    var bar = document.getElementById('bar');
    requestAnimationFrame(function(){ bar.style.width = '0%'; });
    var iv = setInterval(function(){
      sec--;
      cd.textContent = sec;
      if (sec <= 0) { clearInterval(iv); closePage(); }
    }, 1000);
  }

  function closePage() {
    try { window.close(); } catch(e) {}
  }
</script>
</body>
</html>
